<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title desc">
  <title id="title">Viewport Relay — 多屏视口同步：一个主屏，多个跟随窗口</title>
  <desc id="desc">暖纸底标题：Viewport Relay，副标题一个主屏，多个跟随窗口；右侧三台手机框，主屏红框，同一红色按钮在三台手机的不同位置，示意 DOM 点击同步。</desc>

  <rect width="1200" height="360" rx="26" fill="#f6f1e8"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="56" y="62" font-size="19" letter-spacing="3" fill="#a63a2e">CHROME EXTENSION · MV3 多屏同步测试</text>
    <text x="56" y="128" font-size="58" font-weight="700" fill="#211d19">Viewport Relay</text>
    <text x="56" y="168" font-size="23" fill="#4a423c">一个主屏，多个跟随窗口</text>
    <text x="56" y="204" font-size="19" fill="#6b6259">同步滚动、导航与 DOM 点击，一眼看清响应式布局。</text>
    <g id="chips" font-size="18" fill="#4a423c" text-anchor="middle">
      <g><rect x="56" y="238" width="140" height="36" rx="18" fill="#ffffff" stroke="#ddd3c4" stroke-width="1.5"/><text x="126" y="262">4 个预设尺寸</text></g>
      <g><rect x="208" y="238" width="126" height="36" rx="18" fill="#ffffff" stroke="#ddd3c4" stroke-width="1.5"/><text x="271" y="262">最多 8 屏</text></g>
      <g><rect x="346" y="238" width="170" height="36" rx="18" fill="#ffffff" stroke="#ddd3c4" stroke-width="1.5"/><text x="431" y="262">DOM / 坐标点击</text></g>
      <g><rect x="528" y="238" width="140" height="36" rx="18" fill="#ffffff" stroke="#ddd3c4" stroke-width="1.5"/><text x="598" y="262">数据不出本机</text></g>
    </g>
  </g>

  <g id="phones" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="922" y="34" font-size="18" fill="#a63a2e" text-anchor="middle">主屏 MASTER</text>
    <g id="phone-follower-1">
      <rect x="742" y="70" width="104" height="188" rx="16" fill="#ffffff" stroke="#d8cfc0" stroke-width="2"/>
      <g fill="#ece5d8">
        <rect x="754" y="86" width="80" height="8" rx="4"/>
        <rect x="754" y="102" width="56" height="8" rx="4"/>
        <rect x="754" y="170" width="80" height="8" rx="4"/>
        <rect x="754" y="186" width="80" height="8" rx="4"/>
        <rect x="754" y="202" width="48" height="8" rx="4"/>
      </g>
      <rect x="762" y="126" width="64" height="24" rx="5" fill="#a63a2e"/>
      <text x="794" y="142" font-size="14" fill="#ffffff" text-anchor="middle">点击</text>
    </g>
    <g id="phone-master">
      <rect x="862" y="48" width="120" height="224" rx="18" fill="#ffffff" stroke="#c2410c" stroke-width="3"/>
      <g fill="#ece5d8">
        <rect x="876" y="66" width="92" height="8" rx="4"/>
        <rect x="876" y="82" width="64" height="8" rx="4"/>
        <rect x="876" y="102" width="92" height="8" rx="4"/>
        <rect x="876" y="118" width="92" height="8" rx="4"/>
        <rect x="876" y="238" width="56" height="8" rx="4"/>
      </g>
      <rect x="892" y="196" width="60" height="24" rx="5" fill="#a63a2e"/>
      <text x="922" y="212" font-size="14" fill="#ffffff" text-anchor="middle">点击</text>
    </g>
    <g id="phone-follower-2">
      <rect x="998" y="70" width="104" height="188" rx="16" fill="#ffffff" stroke="#d8cfc0" stroke-width="2"/>
      <g fill="#ece5d8">
        <rect x="1010" y="86" width="80" height="8" rx="4"/>
        <rect x="1010" y="102" width="80" height="8" rx="4"/>
        <rect x="1010" y="118" width="48" height="8" rx="4"/>
        <rect x="1010" y="202" width="80" height="8" rx="4"/>
        <rect x="1010" y="218" width="64" height="8" rx="4"/>
      </g>
      <rect x="1018" y="150" width="64" height="24" rx="5" fill="#a63a2e"/>
      <text x="1050" y="166" font-size="14" fill="#ffffff" text-anchor="middle">点击</text>
    </g>
    <g id="phone-labels" font-size="18" text-anchor="middle">
      <text x="794" y="284" fill="#6b6259">跟随</text>
      <text x="922" y="296" fill="#a63a2e">主屏</text>
      <text x="1050" y="284" fill="#6b6259">跟随</text>
    </g>
    <text x="922" y="330" font-size="18" fill="#6b6259" text-anchor="middle">同一元素，不同位置 · 滚动与点击同步</text>
  </g>
</svg>
