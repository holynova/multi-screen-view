<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viewport Relay test fixture</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 4200px;
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
        color: #25211e;
        background: repeating-linear-gradient(#f5f1e9 0 399px, #e7dfd2 400px 401px);
      }
      header { padding: 32px; }
      h1 { margin: 0 0 8px; font-size: 28px; }
      p { margin: 0; line-height: 1.7; }
      .counter {
        position: fixed;
        min-width: 150px;
        min-height: 54px;
        border: 0;
        border-radius: 8px;
        color: white;
        background: #9a341f;
        font: 700 15px/1 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      }
      .dom-target { left: 24px; top: 22%; }
      .coordinate-target { left: 50%; top: 50%; transform: translate(-50%, -50%); background: #334155; }
      @media (min-width: 391px) and (max-width: 407px) {
        .dom-target { left: auto; right: 24px; top: 72%; }
      }
      @media (min-width: 408px) and (max-width: 430px) {
        .dom-target { left: auto; right: 24px; top: 24%; }
      }
      @media (min-width: 431px) {
        .dom-target { left: 24px; top: auto; bottom: 12%; }
      }
      .ruler {
        display: grid;
        gap: 360px;
        padding: 200px 24px 80px;
        font: 600 13px/1 ui-monospace, monospace;
      }
    </style>
  </head>
  <body data-dom-click-count="0" data-coordinate-click-count="0">
    <header>
      <h1>同步测试页</h1>
      <p>不同位置的按钮用于验证 DOM 匹配，居中按钮用于验证相对坐标。</p>
    </header>
    <button id="dom-target" class="counter dom-target" data-testid="responsive-action" type="button">DOM 点击 0</button>
    <button id="coordinate-target" class="counter coordinate-target" type="button">坐标点击 0</button>
    <div class="ruler" aria-hidden="true">
      <span>0400 px</span><span>0800 px</span><span>1200 px</span><span>1600 px</span>
      <span>2000 px</span><span>2400 px</span><span>2800 px</span><span>3200 px</span>
    </div>
    <script>
      const domButton = document.getElementById("dom-target");
      const coordinateButton = document.getElementById("coordinate-target");
      domButton.addEventListener("click", () => {
        const count = Number(document.body.dataset.domClickCount) + 1;
        document.body.dataset.domClickCount = String(count);
        domButton.textContent = `DOM 点击 ${count}`;
      });
      coordinateButton.addEventListener("click", () => {
        const count = Number(document.body.dataset.coordinateClickCount) + 1;
        document.body.dataset.coordinateClickCount = String(count);
        coordinateButton.textContent = `坐标点击 ${count}`;
      });
    </script>
  </body>
</html>
